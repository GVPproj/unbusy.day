version: "3"

# CodeMirror roots in vendorcodemirror are direct upgrade inputs; its generated
# manifest is the complete deployed state reported by version checks.
dotenv: [".env"]

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  dev:
    desc: "templ watch/proxy driving the Go server over a local SQLite file (browse :7331)"
    cmds:
      # templ owns the dev loop: watches .templ/.go, regenerates, (re)runs the
      # server, and reloads the browser via the proxy on :7331. Text-only .templ
      # edits skip rebuild/restart (server re-reads literals per render under
      # TEMPL_DEV_MODE); Go changes restart `go run .`. Don't run air alongside —
      # it rebuilds on every .templ edit and defeats the fast path.
      # We wait out startup 502s (curl -f) before opening the browser.
      # TEMPL_DEV_MODE serves static/ from disk, so app.css edits land live
      # without a rebuild.
      - |
        opener=open; command -v xdg-open >/dev/null && opener=xdg-open
        detach=; command -v setsid >/dev/null && detach=setsid
        # Detach the browser into its own session so Ctrl-C (SIGINT to our
        # process group) stops templ + go run but never reaches the browser —
        # otherwise its renderers die noisily ("Exiting due to channel error.").
        (i=0; until curl -sf -o /dev/null http://127.0.0.1:7331/ || [ $i -ge 100 ]; do i=$((i+1)); sleep 0.2; done; $detach "$opener" "http://127.0.0.1:7331/" >/dev/null 2>&1 </dev/null) &
        templ generate --watch --proxy="http://localhost:${PORT:-8080}" --open-browser=false --cmd="go run ./cmd/unbusy"

  prototype:landing:
    desc: "Throwaway landing study — browse http://localhost:7331/login?variant=A (UNB-77)"
    env:
      LANDING_PROTOTYPE: "1"
      DATABASE_URL: "file:tmp/PROTOTYPE-wipe-me-landing.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)&_pragma=foreign_keys(1)&_txlock=immediate"
    cmds:
      - mkdir -p tmp
      - templ generate --watch --proxy="http://localhost:${PORT:-8080}" --open-browser=false --cmd="go run ./cmd/unbusy"

  dev:tailscale:
    desc: "Like `dev`, but also serves :7331 over Tailscale (HTTPS) for phone testing"
    cmds:
      # Expose the dev proxy on the tailnet so phones/other devices can browse it.
      # `serve --bg` proxies to 127.0.0.1:7331 even before the backend is up, and is
      # torn down when the dev loop exits. If Tailscale is down/logged out we just
      # warn and fall through to the normal local-only dev loop.
      - |
        if tailscale status >/dev/null 2>&1; then
          tailscale serve --bg 7331 >/dev/null 2>&1
          url=$(tailscale serve status 2>/dev/null | sed -nE 's#^(https://[^ ]+).*#\1#p' | head -1)
          echo "▸ Tailscale: serving dev at ${url:-<address unavailable>}"
          # go-task's shell (mvdan.cc/sh) only supports EXIT — but EXIT fires on Ctrl-C too.
          trap 'tailscale serve --https=443 off >/dev/null 2>&1; echo "✓ Tailscale serve stopped"' EXIT
        else
          echo "⚠ Tailscale not up (daemon stopped or logged out) — running local-only on :7331"
        fi
        task dev

  check:versions:
    desc: "Compare pinned tool/browser dependency versions against latest upstream releases"
    cmds:
      - |
        set -eu
        # Latest release tag from the GitHub API / npm registry (drop leading v).
        gh_latest() { curl -fsSL "https://api.github.com/repos/$1/releases/latest" \
          | sed -nE 's/.*"tag_name": *"v?([^"]+)".*/\1/p'; }
        npm_latest() { curl -fsSL "https://registry.npmjs.org/$1/latest" \
          | sed -nE 's/.*"version": *"([^"]+)".*/\1/p'; }
        # Newest tag (for repos that publish tags but no GitHub releases).
        gh_tag() { curl -fsSL "https://api.github.com/repos/$1/tags" \
          | sed -nE 's/.*"name": *"v?([^"]+)".*/\1/p' | head -1; }
        report() { # name pinned latest
          if [ "$2" = "$3" ]; then printf '  ✓ %-11s %s (up to date)\n' "$1" "$2";
          else printf '  ✗ %-11s pinned %s, latest %s\n' "$1" "$2" "$3"; rc=1; drifted="$drifted $1"; fi; }
        rc=0; drifted=''
        report templ "$(go list -m github.com/a-h/templ | awk '{print $2}' | sed 's/^v//')" "$(gh_latest a-h/templ)"
        report ds-sdk "$(go list -m github.com/starfederation/datastar-go | awk '{print $2}' | sed 's/^v//')" "$(gh_tag starfederation/datastar-go)"
        # Datastar client: the shared script component pins the local artifact.
        ds_client=$(sed -nE 's#.*src="/static/vendor/datastar/datastar-([0-9.]+)\.js".*#\1#p' internal/frontend/layouts/datastar.templ)
        test -n "$ds_client"
        test -f "internal/frontend/static/vendor/datastar/datastar-$ds_client.js"
        (cd internal/frontend/static/vendor/datastar &&
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS;
          else shasum -a 256 -c SHA256SUMS; fi)
        report ds-client "$ds_client" "$(gh_latest starfederation/datastar)"
        # CodeMirror graph: deployed package versions in the generated lock manifest.
        for pin in $(jq -r '.modules[] | select(.version != "builtin") | "\(.package)@\(.version)"' internal/frontend/static/vendor/codemirror/manifest.json | sort -u); do
          report "${pin%@*}" "${pin##*@}" "$(npm_latest "${pin%@*}")"
        done
        if [ "$rc" = 1 ]; then
          printf '\n  ⚠ version drift in:%s\n' "$drifted"
          printf '  see the ✗ lines above for pinned vs latest.\n'
        fi
        exit $rc

  vendor:codemirror:
    desc: "Verify and reproduce the content-locked local CodeMirror graph"
    cmds:
      - go run ./internal/frontend/vendorcodemirror

  migrate:
    desc: "Apply pending migrations against $DATABASE_URL (goose, run-once)"
    cmds:
      - go run ./cmd/unbusy migrate

  schema:
    desc: "Regenerate internal/migrate/schema.sql (reference dump, never applied)"
    cmds:
      - go run ./internal/migrate/dumpschema > internal/migrate/schema.sql

  templ:
    desc: "Generate templ Go files"
    # Don't run while `task dev` is up: non-watch generation deletes the watch
    # session's literal cache, 500ing the dev server until restart. CI/test are
    # unaffected (they use literals compiled into *_templ.go).
    cmds:
      - templ generate

  build:
    desc: "Build the Go binary"
    deps: [templ]
    cmds:
      - mkdir -p tmp
      - go build -o tmp/unbusy ./cmd/unbusy

  test:
    desc: "Run Go tests and JS unit tests"
    cmds:
      - go test ./...
      - node --test "internal/frontend/static/js/**/*.test.js"

  browser:install:
    internal: true
    cmds:
      - npm ci --ignore-scripts
      - npx playwright install chromium

  test:browser:
    desc: "Run the full Chromium regression suite (nightly/manual in CI)"
    deps: [build, browser:install]
    cmds:
      - scripts/browser-smoke.sh

  test:browser:smoke:
    desc: "Run the critical Chromium deployment gate"
    deps: [build, browser:install]
    cmds:
      - scripts/browser-smoke.sh --grep @smoke

  fmt:
    desc: "Format Go code"
    cmds:
      - go fmt ./...

  nuke:
    desc: "Delete the local SQLite file (and WAL sidecars); next run re-migrates"
    cmds:
      # Strip the file: scheme and ?query from the DSN, then remove the db and
      # its -wal/-shm sidecars.
      - |
        db="${DATABASE_URL#file:}"; db="${db%%\?*}"
        rm -f "$db" "$db-wal" "$db-shm"
